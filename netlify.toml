[build.environment]
  # Netlify の既定バージョンに引きずられないよう固定する。
  # Next.js 15 / Prisma 6 の動作確認を行っているバージョンに合わせている。
  NODE_VERSION = "22"

[build]
  # build:deploy = prisma migrate deploy && prisma generate && next build
  # デプロイのたびに未適用のマイグレーションを自動で適用する。
  # DBに到達できない場合はデプロイを失敗させる（未マイグレーションのDBに
  # 対してアプリが公開されるより、デプロイが止まるほうが安全なため）。
  command = "npm run build:deploy"

  # Next.js のビルド成果物の場所。
  # 明示しないと Netlify の UI 側の設定（既定ではリポジトリのルート）が使われ、
  # 「publish directory cannot be the same as the base directory」で
  # @netlify/plugin-nextjs が失敗する。netlify.toml は UI 設定より優先されるため、
  # ここに書いておけば UI の状態に関係なく正しい値になる。
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 5分ごとにリマインド処理を起動する。
# netlify/functions/reminders-cron.mts が /api/cron/reminders を呼び出す。
[functions."reminders-cron"]
  schedule = "*/5 * * * *"
